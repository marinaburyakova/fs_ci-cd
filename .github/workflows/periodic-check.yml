name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: Jtalk/url-health-check-action@v3
        with:
          url: https://fs-ci-cd-my.onrender.com
          follow-redirect: false
